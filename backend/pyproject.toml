[project]
name = "litlens-backend"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax, S: security
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]  # `ruff format` handles code width; long strings/docstrings are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
